name: 🐛 Bug report
description: Report a reproducible bug in go-snk
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For usage questions, please use [Discussions Q&A](https://github.com/SharkByteSoftware/go-snk/discussions/categories/q-a) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and this hasn't been reported.
          required: true
        - label: I can reproduce this on the latest go-snk release.
          required: false

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - slicex
        - mapx
        - stringx
        - errorx
        - jsonx
        - httpx
        - httpxtest
        - conditional
        - helpers
        - containers (sets, queues, stacks, lists, priority queues)
        - other / multiple
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest program or test that reproduces the issue. A Go Playground link works too.
      render: go
      placeholder: |
        package main

        import "github.com/SharkByteSoftware/go-snk/slicex"

        func main() {
            // ...
        }
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include full error output or panic stack trace if applicable.
      render: text
    validations:
      required: true

  - type: input
    id: snk-version
    attributes:
      label: go-snk version
      placeholder: v1.3.5
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: go version go1.23.2 linux/amd64
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (OS/arch if relevant, related issues, workarounds).
    validations:
      required: false
